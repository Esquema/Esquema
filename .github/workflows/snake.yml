name: Update Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Snake
        uses: Platane/snk@v2
        with:
          github_user_name: Esquema  # Tu usuario exacto
          svg_out_path: assets/github-snake.svg
          gif_out_path: assets/github-snake.gif  # Opcional
          
      - name: Push Changes
        run: |
          git config --global user.name "Esquema"
          git config --global user.email "tu-email@ejemplo.com"
          git add assets/
          git commit -m "Update snake [skip ci]"
          git push
