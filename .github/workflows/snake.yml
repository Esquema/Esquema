name: Update Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"  # Ejecuta diariamente a medianoche UTC
  workflow_dispatch:     # Permite ejecución manual

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Snake
        uses: Platane/snk@master
        with:
          github_user_name: Esquema  # ¡Cambia esto por tu usuario!
          svg_path: assets/github-contribution-snake.svg
          colors: "gradient:ff79c6,bd93f9"  # Opcional: colores personalizados

      - name: Push Changes
        run: |
          git config --global user.name "Esquema"
          git config --global user.email "tu-email@ejemplo.com"
          git add assets/github-contribution-snake.svg
          git commit -m "Update snake [skip ci]"
          git push
