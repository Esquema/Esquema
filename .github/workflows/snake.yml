name: Generate Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Esquema
          
      - name: Save SVG
        run: |
          mkdir -p assets
          echo "${{ steps.snake.outputs.snake_svg }}" > assets/github-snake.svg
          
      - name: Push Changes
        run: |
          git config --global user.name "Esquema"
          git config --global user.email "esnotfound404@gmail.com"
          git add assets/github-snake.svg
          git commit -m "Update snake [skip ci]" || echo "No changes to commit"
          git push
